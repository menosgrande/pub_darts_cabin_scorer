<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Pub Darts Cabin Scorer</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050508" />
    <meta name="background-color" content="#050508" />

    <!-- iOS: ホーム画面追加でアドレスバーなしのスタンドアロン表示にする -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darts Scorer" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="icon" href="icons/icon-192.png" />

    <!-- React/ReactDOM はCDN依存を無くしローカル同梱（vendor/）。
         キャビン設置での完全オフライン起動を保証するため、unpkg等の外部CDNには依存しない。 -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- ── 読み込み失敗時のフォールバック ──
         スクリプトタグが15個に増えた(app-main.js分割による)ため、キャビンの不安定な
         Wi-Fi/モバイル回線で1本でも読み込みに失敗すると、Reactが一切マウントされず
         背景色(#050508)だけの画面で無言のまま止まってしまう(#rootが空のまま)。
         この<script>は#root直後に置き、他のどのJSにも依存しないインラインの
         見張り役として、一定時間後も#rootが空なら再読み込みを促す表示を出す。
         正常に起動すればReactが#rootへ内容を描画するので、このフォールバックは
         一切表示されない。 -->
    <script>
      (function () {
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.children.length === 0) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#e4e4e7;background:#050508;">' +
              '<p style="font-size:14px;line-height:1.6;">読み込みに失敗しました。<br>電波状況をご確認のうえ、再読み込みしてください。</p>' +
              '<button onclick="location.reload()" style="padding:10px 24px;border-radius:12px;background:#f59e0b;color:#050508;font-weight:900;border:none;font-size:13px;">再読み込み</button>' +
              "</div>";
          }
        }, 8000);
      })();
    </script>

    <!-- app.jsが長大化したため機能単位で分割（js/）。非モジュールscriptなので、
         この順で読み込むことでグローバルスコープにconstが積み上がっていく。
         file://での直接オープンでも動作する（type="module"にするとCORSでブロックされるため避けている）。
         依存関係: constants → checkout → scoring/cpu(どちらもcheckoutに依存、互いには非依存) → ui-components → app-main -->
    <script src="js/constants.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/game/save-utils.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/cpu.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/camera/camera-input.js"></script>
    <script src="js/camera/calibration.js"></script>
    <script src="js/hooks/useSound.js"></script>
    <script src="js/components/HowToModal.js"></script>
    <script src="js/components/ExitConfirmModal.js"></script>
    <script src="js/components/StatsModal.js"></script>
    <script src="js/app-main.js"></script>
    <script>
      // Service Worker登録（オフライン起動・ホーム画面追加対応）。
      // file:// 直開きなど登録できない環境では静かにスキップする。
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
